<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="t d">
  <title id="t">LocalityLens pipeline</title>
  <desc id="d">Seven stages: locality text, extraction, validation, retrieval, disambiguation, geometry, and review and export. Each is marked built, partly built, or planned, and each is labelled as language-model or deterministic-code work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2422"/><stop offset="1" stop-color="#123F37"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7FB8A8"/></marker>
  </defs>
  <rect width="1280" height="330" rx="20" fill="url(#bg)"/>
  <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.6" fill="#5FD3B5">HOW A RECORD MOVES THROUGH LOCALITYLENS</text>
  <rect x="28" y="92" width="156" height="108" rx="14" fill="#14463E" stroke="#5FD3B5" stroke-width="2"/><circle cx="50" cy="114" r="11" fill="#5FD3B5"/><text x="50" y="118.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B2422">1</text><text x="106.0" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Locality text</text><text x="106.0" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#BFE3D8">verbatim label,</text><text x="106.0" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#BFE3D8">kept immutable</text><line x1="187" y1="146.0" x2="201" y2="146.0" stroke="#7FB8A8" stroke-width="2" marker-end="url(#a)"/><rect x="28" y="214" width="156" height="6" rx="3" fill="#5FD3B5" fill-opacity="0.55"/><rect x="206" y="92" width="156" height="108" rx="14" fill="#0B2422" fill-opacity="0.55" stroke="#8A9A95" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="228" cy="114" r="11" fill="#2A4A44"/><text x="228" y="118.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#C9D6D2">2</text><text x="284.0" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#C9D6D2">Extraction</text><text x="284.0" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FA6A0">LLM or rules</text><text x="284.0" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FA6A0">→ exact quotes</text><line x1="365" y1="146.0" x2="379" y2="146.0" stroke="#7FB8A8" stroke-width="2" marker-end="url(#a)"/><rect x="206" y="214" width="156" height="6" rx="3" fill="#B9A6FF" fill-opacity="0.9"/><rect x="384" y="92" width="156" height="108" rx="14" fill="#14463E" stroke="#5FD3B5" stroke-width="2"/><circle cx="406" cy="114" r="11" fill="#5FD3B5"/><text x="406" y="118.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B2422">3</text><text x="462.0" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Validation</text><text x="462.0" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#BFE3D8">quotes → spans in</text><text x="462.0" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#BFE3D8">the original text</text><line x1="543" y1="146.0" x2="557" y2="146.0" stroke="#7FB8A8" stroke-width="2" marker-end="url(#a)"/><rect x="384" y="214" width="156" height="6" rx="3" fill="#5FD3B5" fill-opacity="0.55"/><rect x="562" y="92" width="156" height="108" rx="14" fill="#14463E" stroke="#5FD3B5" stroke-width="2"/><circle cx="584" cy="114" r="11" fill="#5FD3B5"/><text x="584" y="118.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B2422">4</text><text x="640.0" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Retrieval</text><text x="640.0" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#BFE3D8">GNIS candidates</text><text x="640.0" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#BFE3D8">with evidence</text><line x1="721" y1="146.0" x2="735" y2="146.0" stroke="#7FB8A8" stroke-width="2" marker-end="url(#a)"/><rect x="562" y="214" width="156" height="6" rx="3" fill="#5FD3B5" fill-opacity="0.55"/><rect x="740" y="92" width="156" height="108" rx="14" fill="#0B2422" fill-opacity="0.55" stroke="#8A9A95" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="762" cy="114" r="11" fill="#2A4A44"/><text x="762" y="118.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#C9D6D2">5</text><text x="818.0" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#C9D6D2">Disambiguation</text><text x="818.0" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FA6A0">optional second</text><text x="818.0" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FA6A0">LLM call</text><line x1="899" y1="146.0" x2="913" y2="146.0" stroke="#7FB8A8" stroke-width="2" marker-end="url(#a)"/><rect x="740" y="214" width="156" height="6" rx="3" fill="#B9A6FF" fill-opacity="0.9"/><rect x="918" y="92" width="156" height="108" rx="14" fill="#14463E" stroke="#F4B860" stroke-width="2" stroke-dasharray="7 4"/><circle cx="940" cy="114" r="11" fill="#F4B860"/><text x="940" y="118.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B2422">6</text><text x="996.0" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Geometry</text><text x="996.0" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#E6D3B0">geodesic offset</text><text x="996.0" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#E6D3B0">+ uncertainty</text><line x1="1077" y1="146.0" x2="1091" y2="146.0" stroke="#7FB8A8" stroke-width="2" marker-end="url(#a)"/><rect x="918" y="214" width="156" height="6" rx="3" fill="#5FD3B5" fill-opacity="0.55"/><rect x="1096" y="92" width="156" height="108" rx="14" fill="#0B2422" fill-opacity="0.55" stroke="#8A9A95" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="1118" cy="114" r="11" fill="#2A4A44"/><text x="1118" y="118.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#C9D6D2">7</text><text x="1174.0" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#C9D6D2">Review &amp; export</text><text x="1174.0" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FA6A0">curator decision</text><text x="1174.0" y="187" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FA6A0">→ Darwin Core</text><rect x="1096" y="214" width="156" height="6" rx="3" fill="#5FD3B5" fill-opacity="0.55"/>
  
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#A9C9BF">
  <rect x="28" y="279" width="26" height="14" rx="4" fill="#14463E" stroke="#5FD3B5" stroke-width="2"/><text x="62" y="290">built</text>
  <rect x="112" y="279" width="26" height="14" rx="4" fill="#14463E" stroke="#F4B860" stroke-width="2" stroke-dasharray="5 3"/><text x="146" y="290">partly built</text>
  <rect x="240" y="279" width="26" height="14" rx="4" fill="none" stroke="#8A9A95" stroke-width="1.5" stroke-dasharray="3 3"/><text x="274" y="290">planned</text>
  <rect x="420" y="283" width="26" height="6" rx="3" fill="#B9A6FF" fill-opacity="0.9"/><text x="454" y="290">language model reads text</text>
  <rect x="660" y="283" width="26" height="6" rx="3" fill="#5FD3B5" fill-opacity="0.55"/><text x="694" y="290">deterministic, tested code</text>
</g>
<text x="1252" y="290" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#F4B860">the model never outputs coordinates</text>
</svg>
