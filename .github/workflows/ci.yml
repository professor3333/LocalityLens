name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked --all-extras  # type-check and test the optional otel exporter too
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src/
      - name: Tests
        run: uv run pytest -m "not slow and not e2e"
      - name: Browser for end-to-end tests
        run: uv run playwright install --with-deps chromium-headless-shell
      - name: End-to-end tests (review screen)
        run: uv run pytest -m e2e
